<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lobby on the projector</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="lr.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600;700&amp;family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&amp;display=swap">
<style>body{margin:0}a{color:oklch(38% 0.12 250)}a:hover{color:oklch(30% 0.12 250)}</style>
</helmet>
<div class="lr stage">
  <div class="stage-pad" style="gap: 48px">
    <header style="display: flex; align-items: baseline; justify-content: space-between; gap: 40px">
      <p class="serif" style="font-size: 44px; line-height: 1.15">Week 7: cardiac and respiratory priorities</p>
      <p class="stage-label" style="white-space: nowrap">NUR 310 · Ms. Okonkwo</p>
    </header>
    <section aria-label="Join code" style="display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 80px; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 28px">
        <p style="font-size: 44px; font-weight: 500">Go to <span class="mono" style="font-weight: 700">learn-nclex.app/join</span> and type</p>
        <p class="stage-code" data-testid="join-code">V96 RN8</p>
      </div>
      <figure style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px">
        <img src="qr.svg" alt="QR code for joining this live session" style="width: 360px; height: 360px; display: block; border: 3px solid oklch(80% 0.006 260); border-radius: 12px">
        <figcaption class="stage-label">Or scan from the front rows</figcaption>
      </figure>
    </section>
    <hr class="rule" style="height: 3px">
    <section aria-label="In this session" style="display: flex; flex-direction: column; gap: 28px; min-height: 0">
      <div style="display: flex; align-items: baseline; gap: 24px">
        <p class="stage-num">{{count}}</p>
        <p style="font-size: 40px; font-weight: 600">in this session</p>
        <p class="stage-label" style="margin-left: auto">Your teacher starts when everyone is in</p>
      </div>
      <ul style="display: flex; flex-wrap: wrap; gap: 14px 16px; overflow: hidden; max-height: 220px">
        <sc-for list="{{names}}" as="n" hint-placeholder-count="12">
          <li style="font-size: 30px; font-weight: 500; padding: 10px 22px; border-radius: 999px; background: var(--surface-2)">{{n}}</li>
        </sc-for>
      </ul>
    </section>
  </div>
  <a href="QuestionStage.dc.html" style="position: absolute; right: 24px; bottom: 16px; font-size: 14px; color: var(--ink-2)">Next screen</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const names = ["Ada Brennan", "Priya Ramanathan-Okafor", "Marcus Oyelaran-Whitfield", "Jordan Lee", "Sofía Hernández", "Thanh Nguyen", "Grace Mbeki", "Liam O'Connor", "Fatima Al-Sayed", "Noah Kim", "Hannah Schmidt-Larsen", "Diego Ramírez", "Aaliyah Johnson", "Wei Chen", "Emma Rossi", "Kwame Asante", "Olivia Brown", "Yusuf Demir", "Chloe Martin", "Ravi Patel", "Isabella Costa", "Samuel Adeyemi", "Mia Kowalski", "Ethan Wright"];
    return { names, count: names.length };
  }
}
</script>
</body>
</html>
