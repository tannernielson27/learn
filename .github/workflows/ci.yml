name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test:coverage
      - run: pnpm build
      # ADR 0003 / #146. Asserts on the response a client would receive, against the build above
      # rather than `next dev`, because the two need not serialize the same things. Note the
      # build ran with VERCEL_ENV unset: this serves a preview-shaped artifact as production,
      # which is what Vercel's "Promote to Production" does, and the gate still has to hold.
      # The script runs its own control first, so a probe that stopped seeing anything fails
      # loudly instead of passing quietly.
      - run: pnpm gallery:closed
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  db:
    name: db
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Postgres only: migrations and the seed apply from zero on every run.
      - run: pnpm exec supabase db start
      # #163: `supabase test db` through scripts/test-db.mjs, which also fails the run when pgTAP
      # reports `Looks like you planned N tests but ran M`. The harness treats that line as a
      # comment, so a savepoint rollback inside a file could drop pgTAP's count and still pass.
      - name: RLS and schema tests
        run: pnpm test:db
      - name: Generated types match the migrations
        run: |
          pnpm exec supabase gen types typescript --local --schema public > "$RUNNER_TEMP/raw.ts"
          pnpm exec prettier --stdin-filepath src/lib/supabase/database.types.ts < "$RUNNER_TEMP/raw.ts" > "$RUNNER_TEMP/database.types.ts"
          diff -u src/lib/supabase/database.types.ts "$RUNNER_TEMP/database.types.ts" || { echo "::error::database.types.ts is stale. Run pnpm db:types and commit."; exit 1; }

  auth-e2e:
    name: auth e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Postgres, auth, the API gateway, the test mailbox and Realtime. Realtime joined the list
      # with #132: a lobby's roster is presence and a student's screen moves on a `postgres_changes`
      # message, so without it there is no way to test the half of a live session that is live.
      - run: pnpm exec supabase start -x studio,storage-api,imgproxy,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Point the build at the local stack
        run: |
          pnpm exec supabase status -o env \
            | sed -n 's/^API_URL=/NEXT_PUBLIC_SUPABASE_URL=/p; s/^PUBLISHABLE_KEY=/NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=/p; s/^SECRET_KEY=/SUPABASE_SECRET_KEY=/p; s/^JWT_SECRET=/SUPABASE_JWT_SIGNING_KEY=/p' \
            | tr -d '"' >> "$GITHUB_ENV"
      - name: Sign in, then author banks and items
        run: pnpm e2e e2e/auth.spec.ts e2e/authoring.spec.ts e2e/caseStudyBuilder.spec.ts e2e/transfer.spec.ts e2e/folders.spec.ts e2e/tags.spec.ts e2e/history.spec.ts e2e/duplicate.spec.ts e2e/search.spec.ts e2e/bulk-import.spec.ts e2e/warnings.spec.ts e2e/archive.spec.ts e2e/liveSession.spec.ts e2e/join.spec.ts e2e/liveAnswer.spec.ts e2e/routeRecovery.spec.ts e2e/classes.spec.ts e2e/assignments.spec.ts e2e/takeAssignment.spec.ts e2e/assignmentReport.spec.ts e2e/assignmentResults.spec.ts e2e/classTimeZone.spec.ts e2e/studentHistory.spec.ts e2e/practiceShare.spec.ts e2e/liveBytes.spec.ts e2e/practice.spec.ts e2e/landing.spec.ts e2e/emailPreview.spec.ts e2e/errorPages.spec.ts
        env:
          E2E_AUTH: "1"
          # The local-only demo account from supabase/seed-demo.sql, not a secret.
          DEMO_ACCOUNT_EMAIL: demo@learn.test
          DEMO_ACCOUNT_PASSWORD: learn-demo-local
      # #187: five simulated phones through the seeded six-step case study, against the build the
      # e2e step just made (Playwright's webServer runs `pnpm build`, leaving .next here). Small on purpose: it proves the load script and the room still work
      # end to end, not how many students the room holds (docs/load-testing.md has the 60 run).
      - name: Load smoke (five participants)
        timeout-minutes: 4
        run: |
          test -f .next/BUILD_ID || { echo "No production build: the e2e step did not build one."; exit 1; }
          pnpm start --port 3100 > "$RUNNER_TEMP/next-start.log" 2>&1 &
          server=$!
          trap "kill $server" EXIT
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3100/api/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:3100/api/health > /dev/null || { echo "next start never answered /api/health"; cat "$RUNNER_TEMP/next-start.log"; exit 1; }
          pnpm load:live --base http://127.0.0.1:3100 --host --participants 5 --think 200-1000 \
            --ramp 500 --lobby-ms 2000 --reveal-ms 300 --step-timeout 20000 --max-minutes 3 \
            --seed 187 --out "$RUNNER_TEMP/load-live-results.json"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: auth-e2e-report
          path: |
            playwright-report
            test-results
          retention-days: 7
